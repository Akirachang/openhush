# Builds OpenHush.app on an Apple Silicon Mac and publishes it as a GitHub Release.
# Triggered by pushing a version tag:  npm version minor && git push --follow-tags
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      # PyInstaller needs a Python with a shared libpython, which setup-python provides.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci
          cd engine && uv sync --frozen --python "$(which python3.12)"

      - name: Build OpenHush.app
        run: npm run dist

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist.noindex/mac-arm64/OpenHush.app OpenHush-mac-arm64.zip
          shasum -a 256 OpenHush-mac-arm64.zip > OpenHush-mac-arm64.zip.sha256
          cat OpenHush-mac-arm64.zip.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" OpenHush-mac-arm64.zip OpenHush-mac-arm64.zip.sha256 \
            --title "OpenHush ${GITHUB_REF_NAME#v}" --generate-notes
