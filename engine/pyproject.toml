[project]
name = "openhush-engine"
version = "0.1.0"
description = "OpenHush audio engine: local AI noise removal (DeepFilterNet3), driven by the desktop app"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.scripts]
openhush-engine = "openhush_engine.server:main"
openhush-cli = "openhush_engine.cli:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openhush_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (1h+ file, Heavy repair)"]
addopts = "-m 'not slow'"
